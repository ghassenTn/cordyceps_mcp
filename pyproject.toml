[project]
name = "cordyceps-search"
version = "0.1.0"
description = "MCP server for code search and impact analysis (subset of Cordyceps Engine)"
requires-python = ">=3.11"
dependencies = [
    "engramedb",
    "mcp[cli]>=1.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "watchdog>=6.0.0",
    "pytest>=9.1.1",
    "lark-parser>=0.12.0",
]


[tool.uv.sources]
engramedb = { path = "../engramedb", editable = true }

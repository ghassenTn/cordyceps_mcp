[project]
name = "cordyceps-search"
version = "0.2.0"
description = "MCP server giving coding agents structural code understanding: code map, symbol lookup, blast radius"
requires-python = ">=3.11,<3.14"
dependencies = [
    "engramedb>=1.1.5,<2",
    "mcp[cli]>=1.27.0,<2",
    "pydantic>=2,<3",
    "pyyaml>=6.0.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "watchdog>=6.0.0",
]

[project.scripts]
cordyceps-mcp = "main:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.database.parser" = ["languages/*.yaml"]


# For local editable engramedb (sibling ../engramedb checkout), use:
#   uv sync --python 3.11 --refresh-package engramedb
# or temporarily add:
#   [tool.uv.sources]
#   engramedb = { path = "../engramedb", editable = true }
